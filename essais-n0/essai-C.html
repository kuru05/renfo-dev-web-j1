<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadence, assistant bus et tram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F4; --surface:#FFFFFF; --ink:#14213A; --muted:#55617A; --rule:#D3D9E3;
  --signal:#FFC914; --signal-ink:#14213A; --band:#14213A; --band-ink:#FFFFFF;
  --map-bg:#F8F9FB; --focus:#0B66B8; --na:#66728A;
  --f-text:"Barlow","DIN Alternate","Bahnschrift","Segoe UI",system-ui,sans-serif;
  --f-sign:"Barlow Semi Condensed","DIN Condensed","Bahnschrift SemiCondensed","Arial Narrow","Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0D1524; --surface:#172238; --ink:#E9EEF7; --muted:#9AA7BF; --rule:#2B3A57;
    --band:#080E19; --map-bg:#111B2E; --focus:#7FB6F0;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--f-text);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:clamp(360px,36vw,480px) minmax(0,1fr)}

/* Bandeau */
.bar{grid-column:1/-1;background:var(--band);color:var(--band-ink);display:flex;align-items:center;gap:16px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font:700 1.5rem/1 var(--f-sign);letter-spacing:.01em;margin:0}
.brand svg{display:block}
.bar p{margin:0;font-size:.875rem;opacity:.78;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{background:transparent;border:1.5px solid rgba(255,255,255,.38);color:inherit;border-radius:6px;padding:6px 12px;font-weight:500;font-size:.875rem;white-space:nowrap}
.bar button:hover{border-color:#fff}
.bar .plan-toggle{display:none;background:var(--signal);border-color:var(--signal);color:var(--signal-ink);font-weight:600}

/* Conversation */
.chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule)}
.thread{flex:1;overflow-y:auto;padding:22px 20px 8px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{max-width:100%;animation:in .22s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.msg.user{align-self:flex-end;max-width:85%;background:var(--signal);color:var(--signal-ink);padding:9px 14px;border-radius:16px 16px 4px 16px;font-weight:500;overflow-wrap:anywhere}
.msg.bot{align-self:stretch}
.msg.bot > p{margin:0 0 8px;max-width:58ch}
.msg.bot > p:last-child{margin-bottom:0}
.msg.bot > .card + p{margin-top:8px}
.msg.bot ul.plain{margin:0 0 8px;padding-left:1.15em;max-width:58ch}
.msg.bot ul.plain li{margin:2px 0}
.note{color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--surface);border:1.5px solid var(--rule);border-radius:999px;padding:5px 13px;font-size:.9rem;font-weight:500;text-align:left}
.chip:hover{border-color:var(--ink)}

.composer{display:flex;gap:10px;padding:14px 20px 18px;border-top:1px solid var(--rule);background:var(--paper)}
.composer input{flex:1;min-width:0;background:var(--surface);border:1.5px solid var(--rule);border-radius:10px;padding:11px 14px}
.composer input::placeholder{color:var(--muted)}
.composer input:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 35%,transparent)}
.composer button{background:var(--signal);color:var(--signal-ink);border:0;border-radius:10px;padding:0 18px;font-weight:600}
.composer button:hover{filter:brightness(.94)}

/* Pastilles de ligne */
.bdg{display:inline-flex;align-items:center;justify-content:center;min-width:1.9em;height:1.55em;padding:0 .4em;background:var(--c);color:var(--k);font:700 .9em/1 var(--f-sign);border-radius:5px;vertical-align:middle;letter-spacing:.01em}
.bdg.tram{border-radius:999px}
.linelist .bdg{justify-self:start}

/* Fiches */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px 16px 14px}
.card h3{margin:0;font:600 1.3rem/1.2 var(--f-sign)}
.card h3 .arrow{color:var(--muted);font-weight:500;padding:0 .15em}
.card .sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.card p{max-width:none}
.card .foot{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--rule);font-size:.93rem}
.linkish{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;font-size:.9rem;font-weight:500;margin-top:10px}

.sum{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;margin-top:12px}
.sum .hours{font:700 1.75rem/1 var(--f-sign);font-variant-numeric:tabular-nums}
.sum .hours span{color:var(--muted);font-weight:500;padding:0 .12em}
.sum .dur{font-weight:600}
.sum .chg{color:var(--muted)}

.legs{list-style:none;margin:14px 0 0;padding:0}
.leg,.xfer{display:grid;grid-template-columns:3.3em 18px 1fr;column-gap:10px}
.leg{grid-template-rows:auto auto auto;position:relative}
.leg::before{content:"";grid-column:2;grid-row:1/4;justify-self:center;width:6px;border-radius:3px;background:var(--c);margin:11px 0}
.leg.bus::before{width:4px}
.leg time{grid-column:1;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.leg .dot{grid-column:2;justify-self:center;align-self:center;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--c);z-index:1}
.leg .stop{grid-column:3;font-weight:600}
.leg .r1{grid-row:1}.leg .r3{grid-row:3}
.leg .ride{grid-column:3;grid-row:2;padding:7px 0 9px;font-size:.93rem;color:var(--muted)}
.leg .ride .dir{color:var(--ink)}
.leg details{margin-top:3px}
.leg summary{cursor:pointer;width:fit-content}
.leg details ul{list-style:none;margin:5px 0 0;padding:0;font-variant-numeric:tabular-nums}
.leg details li{padding:1px 0}
.leg details li time{display:inline-block;width:3.2em;text-align:left;font-weight:500;color:var(--muted)}
.xfer{color:var(--muted);font-size:.9rem;min-height:34px;align-items:center}
.xfer::before{content:"";grid-column:2;justify-self:center;height:100%;border-left:2px dotted var(--muted)}
.xfer span{grid-column:3}

.board{list-style:none;margin:12px 0 0;padding:0}
.board li{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:8px 0;border-top:1px solid var(--rule)}
.board .dir{flex:1 1 9em;min-width:0;font-weight:500}
.board .times{margin-left:auto;font-variant-numeric:tabular-nums;text-align:right;color:var(--muted);white-space:nowrap}
.board .times small{font-size:.82rem}
.board .times b{color:var(--ink);font:700 1.1rem/1 var(--f-sign);margin-right:.5em}

.linelist{list-style:none;margin:10px 0 0;padding:0}
.linelist li{border-top:1px solid var(--rule)}
.linelist button{display:grid;grid-template-columns:3.2em 1fr;gap:10px;align-items:center;width:100%;background:none;border:0;padding:8px 0;text-align:left}
.linelist button:hover .ends{text-decoration:underline;text-underline-offset:3px}
.linelist small{display:block;color:var(--muted);font-size:.82rem}

.tt{width:100%;border-collapse:collapse;margin-top:12px;font-size:.92rem;font-variant-numeric:tabular-nums}
.tt th,.tt td{text-align:left;padding:6px 8px 6px 0;border-top:1px solid var(--rule);vertical-align:top}
.tt th{font-weight:600}
.tt thead th{border-top:0;color:var(--muted);font-weight:500;font-size:.85rem}
.tt td.num{text-align:right;padding-right:0;white-space:nowrap;font-weight:600}
.tt small{display:block;color:var(--muted)}

.thermo{list-style:none;margin:12px 0 0;padding:0}
.thermo li{display:grid;grid-template-columns:18px 1fr;column-gap:10px;align-items:center;position:relative;padding:3px 0}
.thermo li::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:6px;background:var(--c)}
.thermo.bus li::before{left:7px;width:4px}
.thermo li:first-child::before{top:50%}.thermo li:last-child::before{bottom:50%}
.thermo .dot{width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--c);justify-self:center;z-index:1}
.thermo .nm .bdg{font-size:.72em;margin-left:4px}
.thermo li.term .nm{font-weight:600}

/* Plan */
.plan{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--map-bg)}
.plan-head{display:flex;align-items:baseline;gap:12px;padding:14px 20px 0}
.plan-head h2{margin:0;font:600 1.15rem/1.2 var(--f-sign)}
.plan-head p{margin:0;color:var(--muted);font-size:.875rem;flex:1}
.plan-head button{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:.875rem;font-weight:500}
.canvas{position:relative;flex:1;min-height:0;padding:4px 8px}
.canvas svg{width:100%;height:100%;display:block}
.ln{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity .2s}
.st{cursor:pointer;transition:opacity .2s}
.st circle{fill:var(--surface);stroke:var(--ink);stroke-width:2.2}
.st.hub circle{stroke-width:2.8}
.st text{font:500 12.5px var(--f-sign);fill:var(--ink);paint-order:stroke;stroke:var(--map-bg);stroke-width:3.5px;stroke-linejoin:round}
.st.hub text{font-weight:600}
.st:hover text{text-decoration:underline}
.st .hit{fill:transparent;stroke:none}
svg.focus .ln,svg.focus .st{opacity:.16}
svg.focus .ln.on,svg.focus .st.on{opacity:1}
.st .ring{display:none;fill:var(--signal);stroke:var(--ink);stroke-width:2}
.st.end .ring{display:block}
.st.end text{font-weight:700;font-size:13.5px}
.rt-case{fill:none;stroke:var(--map-bg);stroke-linecap:round;stroke-linejoin:round}
.rt{fill:none;stroke-linecap:round;stroke-linejoin:round}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;padding:6px 20px 16px}
.legend button{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:4px 10px 4px 5px;font-size:.84rem}
.legend button:hover{border-color:var(--ink)}
.pop{position:absolute;z-index:5;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 6px 22px rgba(20,33,58,.18);padding:10px;display:grid;gap:6px;min-width:180px}
.pop strong{font:600 1rem/1.2 var(--f-sign);padding:0 4px 2px}
.pop button{background:none;border:0;text-align:left;padding:5px 8px;border-radius:6px;font-size:.92rem}
.pop button:hover{background:var(--paper)}
[hidden]{display:none!important}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .chat{border-right:0;min-width:0}
  .canvas{overflow:auto;padding:0}
  .canvas svg{width:880px;height:auto;max-width:none}
  .legend{padding:10px 14px 14px;border-top:1px solid var(--rule)}
  .legend button span:last-child{display:none}
  .legend button{padding:5px}
  .plan-head{padding:12px 14px 8px}
  .bar{padding:10px 14px;gap:10px}
  .bar .plan-toggle{display:block}
  .plan{position:fixed;inset:0;top:var(--bar-h,52px);z-index:10;display:none}
  .plan.open{display:flex}
  .thread{padding:16px 14px 6px}
  .composer{padding:12px 14px 14px}
  .bar .reset{display:none}
}
@media (max-width:520px){ .bar p{display:none} .brand{flex:1} .plan-head p{display:none} .plan-head h2{flex:1} }
@media (prefers-reduced-motion:reduce){ .msg{animation:none} .thread{scroll-behavior:auto} .ln,.st{transition:none} }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1 class="brand">
      <svg width="34" height="20" viewBox="0 0 34 20" aria-hidden="true"><path d="M4 15H13L21 5H30" fill="none" stroke="#FFC914" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="4" cy="15" r="3" fill="#14213A" stroke="#fff" stroke-width="2"/><circle cx="30" cy="5" r="3" fill="#14213A" stroke="#fff" stroke-width="2"/></svg>
      Cadence
    </h1>
    <p>Bus et tram de Valorgue, réseau fictif de démonstration</p>
    <button type="button" class="reset" id="reset">Nouvelle conversation</button>
    <button type="button" class="plan-toggle" id="planToggle" aria-expanded="false" aria-controls="plan">Plan</button>
  </header>

  <main class="chat">
    <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation"></div>
    <form class="composer" id="composer" autocomplete="off">
      <input id="q" type="text" aria-label="Votre question" placeholder="De la gare à l’aéroport à 8h30, horaires du T1…" enterkeyhint="send">
      <button type="submit">Envoyer</button>
    </form>
  </main>

  <aside class="plan" id="plan" aria-label="Plan du réseau">
    <div class="plan-head">
      <h2>Plan du réseau</h2>
      <p id="planHint">Cliquez sur un arrêt pour partir de là, y aller ou voir ses prochains passages.</p>
      <button type="button" id="planReset" hidden>Tout afficher</button>
    </div>
    <div class="canvas" id="canvas"></div>
    <div class="legend" id="legend"></div>
  </aside>
</div>

<script>
'use strict';
/* ==========================================================================
   1. DONNÉES DU RÉSEAU
   Tout ce qui décrit le réseau est ici : arrêts, lignes, horaires, tarifs.
   Pour adapter le chatbot à un autre réseau, il suffit de modifier ce bloc.
   ========================================================================== */

const RESEAU = { nom: 'Cadence', ville: 'Valorgue', agence: 'Gare Centrale' };
const CORRESPONDANCE_MIN = 3;           // minutes minimales pour changer de véhicule

// [id, nom, colonne, rangée, position du libellé sur le plan, autres noms acceptés, options]
const STOP_ROWS = [
  ['tilleuls',   'Les Tilleuls',        6, 0,  'E',  [], { pr: true }],
  ['universite', 'Université',          6, 1,  'E',  ['fac', 'faculte', 'univ']],
  ['hopital',    'Hôpital Nord',        6, 2,  'W',  ['hopital', 'chu']],
  ['jardin',     'Jardin des Plantes',  6, 3,  'SE', ['jardin', 'jardin botanique']],
  ['cathedrale', 'Cathédrale',          6, 4,  'W',  []],
  ['hdv',        'Hôtel de Ville',      6, 5,  'U',  ['mairie', 'hdv', 'centre ville', 'centre']],
  ['gare',       'Gare Centrale',       6, 6,  'NW', ['gare', 'gare sncf']],
  ['marche',     'Place du Marché',     6, 7,  'SW', ['marche']],
  ['stade',      'Stade Municipal',     6, 8,  'W',  ['stade']],
  ['port',       'Port Fluvial',        6, 9,  'SE', ['port']],
  ['expo',       'Parc des Expositions',6, 10, 'E',  ['parc expo', 'parc des expos', 'expo', 'expos', 'expositions', 'parc'], { pr: true }],
  ['sciences',   'Cité des Sciences',   0, 5,  'S',  ['sciences', 'cite']],
  ['ormes',      'Les Ormes',           1, 5,  'U',  []],

  ['pasteur',    'Lycée Pasteur',       3, 5,  'U',  ['lycee', 'pasteur']],

  ['collines',   'Les Collines',        9, 4,  'SE', []],
  ['belvedere',  'Belvédère',           10, 3, 'SE', []],
  ['lac',        'Lac d’Argent',        11, 2, 'E',  ['lac']],
  ['citeu',      'Cité U',              5, 1,  'N',  ['cite universitaire', 'residence universitaire', 'cite']],
  ['acacias',    'Les Acacias',         4, 2,  'W',  []],
  ['piscine',    'Piscine Olympique',   4, 3,  'NE', ['piscine']],
  ['marronniers','Les Marronniers',     3, 4,  'W',  []],
  ['clinique',   'Clinique Sainte-Anne',3, 6,  'W',  ['clinique', 'sainte anne', 'ste anne']],
  ['ruebasse',   'Rue Basse',           5, 7,  'N',  []],
  ['annexe',     'Mairie Annexe',       7, 2,  'NE', ['annexe']],

  ['za',         'Zone Artisanale',     9, 6,  'SE',  ['za']],
  ['bellevue',   'Bellevue',            8, 7,  'SE', []],
  ['velodrome',  'Vélodrome',           7, 8,  'SE', []],
  ['chateau',    'Château d’Eau',       4, 9,  'S',  ['chateau']],
  ['chantiers',  'Les Chantiers',       8, 9,  'N',  []],
  ['grandsud',   'Grand Sud',           10, 9, 'E',  ['centre commercial', 'centre commercial grand sud']],
  ['valfleuri',  'Val Fleuri',          1, 4,  'W',  []],
  ['bruyeres',   'Les Bruyères',        2, 3,  'N',  []],
  ['activites',  'Parc d’Activités',    10, 7, 'S',  ['activites', 'parc']],
  ['aeroport',   'Aéroport',            12, 7, 'S',  ['aerogare', 'terminal']],
];

// Fréquences : [début, fin, intervalle en minutes] des départs au terminus.
// Une fin avant 4h00 est comprise comme « après minuit ».
const SERVICES = {
  tram: {
    semaine:  [['05:00','07:00',10], ['07:00','09:30',5], ['09:30','16:00',10], ['16:00','19:30',5], ['19:30','21:30',10], ['21:30','00:30',15]],
    samedi:   [['05:30','08:00',15], ['08:00','20:00',8], ['20:00','00:30',15]],
    dimanche: [['06:40','10:00',20], ['10:00','20:00',12], ['20:00','00:00',20]],
  },
  tram3: {
    semaine:  [['05:30','07:00',15], ['07:00','09:30',6], ['09:30','16:00',10], ['16:00','19:30',6], ['19:30','21:30',12], ['21:30','00:00',15]],
    samedi:   [['06:00','08:00',15], ['08:00','20:00',10], ['20:00','00:00',20]],
    dimanche: [['07:00','10:00',20], ['10:00','20:00',15], ['20:00','23:30',30]],
  },
  bus: {

    samedi:   [['06:30','20:30',20]],
    dimanche: [['08:00','20:00',30]],
  },
  bus12: {
    semaine:  [['06:20','07:00',20], ['07:00','09:00',12], ['09:00','16:00',20], ['16:00','19:00',12], ['19:00','20:30',30]],
    samedi:   [['07:00','20:00',30]],
    dimanche: null,                       // la ligne 12 ne circule pas le dimanche
  },
  bus20: {

    samedi:   [['07:00','20:00',30]],
    dimanche: [['09:00','19:00',60]],
  },
  navette: {
    semaine:  [['04:30','23:30',20]],
    samedi:   [['04:30','23:30',30]],
    dimanche: [['04:30','23:30',30]],
  },
};

// mins = temps de parcours entre deux arrêts consécutifs
// decalage = minutes ajoutées à tous les départs, pour soigner les correspondances
const LINES = [
  { id: 'T1', code: 'T1', mode: 'tram', nom: 'Tram T1', color: '#D4271E', ink: '#fff', service: 'tram', decalage: 0,
    stops: ['tilleuls','universite','hopital','jardin','cathedrale','hdv','gare','marche','stade','port','expo'],
    mins: [2,2,2,2,2,2,2,2,2,3] },
  { id: 'T2', code: 'T2', mode: 'tram', nom: 'Tram T2', color: '#0B66B8', ink: '#fff', service: 'tram', decalage: 3,
    stops: ['sciences','ormes','beauxarts','pasteur','theatre','opera','hdv','republique','halles','quai','moulins','technopole'],
    mins: [2,2,2,2,2,2,2,2,2,2,3] },
  { id: 'T3', code: 'T3', mode: 'tram', nom: 'Tram T3', color: '#16824A', ink: '#fff', service: 'tram3', decalage: 5,

      if (d < bestD) { best = ids; bestD = d; tie = false; } else if (d === bestD && ids.join() !== best.join()) tie = true;
    }
    if (best && !tie) {
      mentions.push({ ids: best.slice(), i, n, s: slice[0].s, e: slice[n - 1].e, fuzzy: true });
      slice.forEach(x => { x.used = x.stop = true; });
    }
  }
  mentions.sort((a, b) => a.i - b.i);

  // rôle de chaque arrêt : départ, arrivée ou direction
  for (const m of mentions) {
    let j = m.i - 1;
    while (j >= 0 && ARTICLES.has(tokens[j].t)) j--;
    const mk = j >= 0 ? tokens[j].t : '', mk2 = j >= 1 ? tokens[j - 1].t : '';
    if (mk === 'direction' || (mk === 'de' && mk2 === 'direction')) m.dir = true;
    else if (FROM_MARK.has(mk)) m.role = /^(pres|cote|autour|proche)$/.test(mk2) ? null : 'from';
    else if (/^(a|au|aux)$/.test(mk)) m.role = /^(suis|habite|trouve|depart|actuellement|ici)$/.test(mk2) ? 'from' : 'to';
    else if (TO_MARK.has(mk)) m.role = 'to';
    m.toward = mk === 'pour' || mk === 'vers';
  }

  // mot qui ressemble à un lieu mais que le réseau ne connaît pas
  let unknown = null;
  for (let i = 0; i < tokens.length && !unknown; i++) {
    const tk = tokens[i];
    if (tk.used || VOCAB.has(tk.t) || tk.t.length < 3 || /^\d/.test(tk.t)) continue;
    let j = i - 1;
    while (j >= 0 && ARTICLES.has(tokens[j].t)) j--;
    if (j < 0 || !/^(a|au|aux|vers|de|du|des|d|depuis|pour|jusqu)$/.test(tokens[j].t) || tokens[j].stop) continue;
    let k = i;
    while (k + 1 < tokens.length && !tokens[k + 1].used && !VOCAB.has(tokens[k + 1].t)) k++;
    unknown = raw.slice(tk.s, tokens[Math.min(k, i + 3)].e);
  }

  const kw = {
    sched: /\bhoraires?\b|\bprochaine?s?\b|\bpassages?\b|\bquand\b|quelle heure|\bfrequences?\b|toutes les combien|\bpasse(nt)?\b|\bcircule(nt)?\b|\battente\b/.test(flat),
    first: /\bpremiere?s?\b/.test(flat),
    last: /\bdernie(r|re)s?\b/.test(flat),
    go: /\b(aller|rendre|rejoindre|vais|itineraires?|trajets?|venir|emmene|chemin)\b|combien de temps|\bduree\b/.test(flat),
    leave: /\b(pars|partir|partant|part|depart)\b|\bje suis\b/.test(flat),
    fare: /\b(tarifs?|prix|cout|coute|coutent|tickets?|billets?|abonnements?|abo|carnets?|pass|gratuite?|reductions?|reduits?|etudiants?|seniors?|payer|paiement|acheter|achat|euros?|cher|mensuel|annuel|titres?)\b|€|c est combien|combien (ca |cela )?(coute|fait)/.test(flat),
    lines: /\blignes?\b|\bplan\b|\breseau\b/.test(flat),
    back: /\bretour\b|sens inverse|autre sens|\binverse\b/.test(flat),
    next: /\bsuivante?s?\b|plus tard|\bd apres\b|\bprochain depart\b/.test(flat),
    prev: /plus tot|\bprecedente?s?\b|\bd avant\b/.test(flat),
    greet: /^\s*(bonjour|bonsoir|salut|hello|coucou|hey|bjr|slt)\b/.test(flat),
    thanks: /\bmerci\b|\bparfait\b|\bsuper\b|\bgenial\b|\btop\b|\bnickel\b/.test(flat),
    ok: /^\s*(ok|okay|d accord|ca marche|entendu|tres bien|bien)\s*[.!]*\s*$/.test(flat),
    bye: /au revoir|a bientot|bonne (journee|soiree)|\bbye\b|\bciao\b/.test(flat),
    help: /\baide\b|\bhelp\b|que (sais|peux) tu|que (savez|pouvez) vous|comment ca marche|tu fais quoi|qui es tu|a quoi (tu sers|sers tu)/.test(flat),
  };
  const topic =
    /\bvelos?\b|trottinette/.test(flat) ? 'velo' :
    /fauteuil|\bpmr\b|accessib|handicap|poussette|mobilite reduite/.test(flat) ? 'pmr' :
    /p ?\+ ?r|parking|parc relais|\brelais\b|\bgarer\b|\bvoiture\b/.test(flat) ? 'pr' :
    /objets? (perdu|trouve)|\bperdu\b|\boublie\b/.test(flat) ? 'objets' :
    /\bchiens?\b|\bchats?\b|\banima(l|ux)\b/.test(flat) ? 'animaux' :
    /trafic|perturb|\bgreve|\bretards?\b|travaux|incident|\bpanne\b|temps reel/.test(flat) ? 'trafic' :
    /\bvalid|compost|controle|\bamende/.test(flat) ? 'validation' :
    /\bcontact|\bagence\b|telephone|reclamation|service client/.test(flat) ? 'contact' :
    /\bde nuit\b|\bla nuit\b|noctambus|\bjours? feries?\b|\bferie\b/.test(flat) ? 'nuit' : null;

  return { raw, flat, tokens, when, lines, mentions, unknown, kw, topic };
}

function resolveWhen(w, now, opts) {
  const today = midnight(now), nowMin = minutesOf(now);
  let date = w.day || today, t, assumed = false;
  if (w.rel !== null && !w.day) t = nowMin + w.rel;
  else if (w.minutes !== null) {
    t = w.minutes;
    if (!w.day && t < nowMin - 30) { date = addDays(today, 1); assumed = true; }
  }
  else if (w.part !== null) { t = w.part; if (sameDay(date, today)) t = Math.max(t, nowMin); }
  else if (w.day && !sameDay(w.day, today)) t = 8 * 60;
  else t = nowMin;
  let mode = w.arrive ? 'arrive' : 'depart';
  if (opts && opts.first) { t = 4 * 60; mode = 'depart'; }
  if (opts && opts.last) { t = 27 * 60 + 30; mode = 'arrive'; }
  const live = sameDay(date, today) && Math.abs(t - nowMin) < 1 && !w.minutes && !(opts && (opts.first || opts.last));
  return { date, t, mode, live, assumed, first: !!(opts && opts.first), last: !!(opts && opts.last) };
}

const NB = ' ', NNB = ' ';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = t => { t = ((Math.round(t) % 1440) + 1440) % 1440; return Math.floor(t / 60) + 'h' + String(t % 60).padStart(2, '0'); };
const dur = m => m < 60 ? m + NB + 'min' : Math.floor(m / 60) + NB + 'h' + NB + String(m % 60).padStart(2, '0');
const euro = v => v.toFixed(2).replace('.', ',') + NB + '€';
const plural = (n, one, many) => n + NB + (n > 1 ? many : one);
const nameOf = id => esc(STOPS[id].name);
const badge = id => { const l = LINE[id]; return `<span class="bdg ${l.mode}" style="--c:${l.color};--k:${l.ink}">${esc(l.code)}</span>`; };
const TYPE_LABEL = { semaine: 'du lundi au vendredi', samedi: 'le samedi', dimanche: 'le dimanche et les jours fériés' };
function dayLabel(date, now) {
  const today = midnight(now);
  if (sameDay(date, today)) return 'aujourd’hui';
  if (sameDay(date, addDays(today, 1))) return 'demain';
  return new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }).format(date);
}
const fullDate = date => new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }).format(date);

function tripReply(from, to, q, now) {
  if (from === to) return { html: `<p>Le départ et l’arrivée sont le même arrêt, ${nameOf(from)}. Où souhaitez-vous aller${NNB}?</p>`, pending: { from, ask: 'to' } };
  const net = network(q.date);
  let j = q.mode === 'arrive' ? arriveBy(net, from, to, q.t) : departAt(net, from, to, q.t);
  let lead = '';
  if (!j && q.mode === 'arrive') {
    j = departAt(net, from, to, q.last ? 0 : q.t);
    if (j) lead = q.last ? '' : `<p>Aucun trajet n’arrive avant ${fmt(q.t)}. Voici le premier départ possible ensuite.</p>`;
  }
  if (!j) return { html: `<p>Je ne trouve aucun trajet entre ${nameOf(from)} et ${nameOf(to)} dans les deux jours qui suivent.</p>` };

  const depDate = addDays(q.date, Math.floor(j.dep / 1440));
  const serviceDate = addDays(q.date, j.legs[0].day);
  if (q.mode === 'depart' && !q.first && j.dep - q.t > 45) {
    const dead = LINES.filter(l => !SERVICES[l.service][dayType(q.date)] && (STOPS[from].lines.concat(STOPS[to].lines)).includes(l.id));
    const why = dead.length && j.legs[0].day > 0 ? ` La ligne ${esc(dead[0].code)} ne circule pas ${TYPE_LABEL[dayType(q.date)]}.` : '';
    lead = `<p>Pas de départ possible avant ${sameDay(depDate, q.date) ? '' : dayLabel(serviceDate, now) + ' '}${fmt(j.dep)}.${why}</p>`;
  }
  if (q.assumed) lead += `<p class="note">${fmt(q.t)} est déjà passé aujourd’hui, j’ai cherché pour demain.</p>`;
  if (q.first) lead = `<p>Premier trajet de la journée${NB}:</p>`;
  if (q.last) lead = `<p>Dernier trajet de la journée${NB}:</p>`;

  const total = j.arr - j.dep, changes = j.legs.length - 1, tk = ticketsFor(j);
  let legs = '';
  j.legs.forEach((l, i) => {
    const line = LINE[l.line], mid = l.stops.slice(1, -1), n = l.stops.length - 1;
    if (i > 0) legs += `<li class="xfer"><span>Correspondance, ${dur(l.dep - j.legs[i - 1].arr)} d’attente</span></li>`;
    const detail = mid.length
      ? `<details><summary>${plural(n, 'arrêt', 'arrêts')}, ${dur(l.arr - l.dep)}</summary><ul>${mid.map(s => `<li><time>${fmt(s.t)}</time>${nameOf(s.id)}</li>`).join('')}</ul></details>`
      : `<div>1${NB}arrêt, ${dur(l.arr - l.dep)}</div>`;
    legs += `<li class="leg ${line.mode}" style="--c:${line.color}">
<time class="r1">${fmt(l.dep)}</time><span class="dot r1"></span><span class="stop r1">${nameOf(l.from)}</span>
<div class="ride">${badge(l.line)} <span class="dir">direction ${nameOf(l.head)}</span>${detail}</div>
<time class="r3">${fmt(l.arr)}</time><span class="dot r3"></span><span class="stop r3">${nameOf(l.to)}</span></li>`;
  });
  const fare = tk.airport
    ? `Ticket Aéroport${NB}: <strong>${euro(tk.price)}</strong>${tk.n > 1 ? '' : ', correspondances comprises pendant 1' + NB + 'h'}. Gratuit avec un abonnement mensuel ou annuel.`
    : `${tk.n > 1 ? tk.n + NB + 'tickets' : 'Un ticket'}${NB}: <strong>${euro(tk.price)}</strong>${tk.n > 1 ? ' (le trajet dépasse 1' + NB + 'h de validité)' : changes ? ', correspondance comprise' : ''}.`;

  const html = `${lead}<article class="card">
<h3>${nameOf(from)} <span class="arrow">→</span> ${nameOf(to)}</h3>
<p class="sub">${esc(fullDate(depDate))}</p>
<div class="sum"><span class="hours">${fmt(j.dep)}<span>→</span>${fmt(j.arr)}</span><span class="dur">${dur(total)}</span><span class="chg">${changes ? plural(changes, 'correspondance', 'correspondances') : 'direct'}</span></div>
<ol class="legs">${legs}</ol>
<p class="foot">${fare}</p>
<button type="button" class="linkish" data-plan>Voir sur le plan</button>
</article>`;
  return {
    html,
    chips: [{ label: 'Départ suivant', send: 'Départ suivant' }, { label: 'Trajet retour', send: 'Trajet retour' }, { label: 'Tous les tarifs', send: 'Tarifs' }],
    map: { type: 'route', from, to, legs: j.legs.map(l => ({ line: l.line, stops: l.stops.map(s => s.id) })) },
    last: { kind: 'route', from, to, q, journey: j },
  };
}

function boardReply(stop, q, filter, now) {
  const s = STOPS[stop], net = network(q.date);
  const rows = nextDepartures(net, stop, q.t, filter, 3).sort((a, b) => (a.times[0] || 1e9) - (b.times[0] || 1e9));
  const lineOk = !filter.line || s.lines.includes(filter.line);
  if (!lineOk) {
    return { html: `<p>La ligne ${badge(filter.line)} ne dessert pas l’arrêt ${nameOf(stop)}. Cet arrêt est desservi par ${s.lines.map(badge).join(' ')}.</p>`,
      chips: [{ label: 'Prochains passages à ' + s.name, send: 'Prochains passages à l’arrêt ' + s.name }], map: { type: 'stop', stop } };
  }
  const items = rows.map(r => {
    let times;
    if (!r.times.length) times = `<span>pas de passage</span>`;
    else if (q.live && r.times[0] - q.t < 60) {
      const wait = Math.max(0, Math.round(r.times[0] - q.t));
      times = `<b>${wait < 1 ? 'à l’approche' : wait + NB + 'min'}</b>${r.times.slice(1).map(fmt).join('  ')}`;
    } else {
      const off = Math.floor(r.times[0] / 1440) - Math.floor(q.t / 1440);
      times = `<b>${fmt(r.times[0])}</b>${r.times.slice(1).map(fmt).join('  ')}${off > 0 || r.times[0] - q.t > 12 * 60 ? '<br><small>' + esc(dayLabel(addDays(q.date, Math.floor(r.times[0] / 1440)), now)) + '</small>' : ''}`;
    }
    return `<li>${badge(r.line)}<span class="dir">vers ${nameOf(r.head)}</span><span class="times">${times}</span></li>`;
  }).join('');
  const sub = q.live ? `Prochains passages, ${fmt(q.t)}` : `Passages ${esc(dayLabel(q.date, now))} à partir de ${fmt(q.t)}`;
  const extra = s.pr ? `<p class="foot">Parc relais P+R à cet arrêt, gratuit avec un titre validé dans la journée.</p>` : '';
  const html = `<article class="card"><h3>${nameOf(stop)}</h3><p class="sub">${sub}</p><ul class="board">${items}</ul>${extra}</article>
<p class="note">Horaires théoriques, sans information en temps réel.</p>`;
  return {
    html,
    chips: [{ label: 'Partir d’ici', send: 'Je pars de l’arrêt ' + s.name }, { label: 'Aller à cet arrêt', send: 'Je vais à l’arrêt ' + s.name }],
    map: { type: 'stop', stop },
    last: { kind: 'stop', stop, filter },
  };
}

function headways(line, type) {

}

}

function suggest(word) {
  const key = normName(word);
  const scored = Object.values(STOPS).map(s => {
    const n = normName(s.name);
    const d = Math.min(osa(key, n), ...n.split(' ').filter(x => x.length > 2).map(x => osa(key, x)));
    return { s, d: n.includes(key) ? 0 : d };
  }).sort((a, b) => a.d - b.d);
  return scored.filter(x => x.d <= Math.max(1, Math.floor(key.length / 4))).slice(0, 3).map(x => x.s);
}
function unknownReply(word) {
  const sug = suggest(word);
  return {
    html: `<p>Je ne trouve pas d’arrêt «${NB}${esc(word)}${NB}» sur le réseau. ${sug.length ? 'Vouliez-vous dire' + NB + ':' : 'Donnez un autre nom d’arrêt ou choisissez-le sur le plan.'}</p>`,
    chips: sug.length ? sug.map(s => ({ label: s.name, send: s.name })) : null,
  };
}

function askMissing(pending) {
  ctx.pending = pending;
  if (pending.from && !pending.to) { pending.ask = 'to'; return { html: `<p>Départ${NB}: ${nameOf(pending.from)}. Où allez-vous${NNB}?</p>`, map: { type: 'stop', stop: pending.from } }; }
  if (pending.to && !pending.from) { pending.ask = 'from'; return { html: `<p>Arrivée${NB}: ${nameOf(pending.to)}. D’où partez-vous${NNB}?</p>`, map: { type: 'stop', stop: pending.to } }; }
  pending.ask = 'from';
  return { html: `<p>D’où partez-vous${NNB}?</p>` };
}

function respond(input) {
  const now = clock();
  let text = String(input).trim().slice(0, 300);
  if (!text) return { html: `<p>Écrivez votre question, par exemple «${NB}de la gare à l’aéroport${NB}».</p>` };

  // réponse à une question « lequel de ces arrêts ? »
  if (ctx.disambig) {
    const d = ctx.disambig, pp = parse(text, now);
    ctx.disambig = null;
    if (pp.mentions.length === 1 && pp.tokens.length <= 5) {
      const hit = pp.mentions[0].ids.filter(id => d.options.includes(id));
      if (hit.length === 1) text = d.raw.slice(0, d.s) + STOPS[hit[0]].name + d.raw.slice(d.e);
    }
  }

  const p = parse(text, now), K = p.kw;
  const amb = p.mentions.find(m => m.ids.length > 1);
  if (amb) {
    ctx.disambig = { raw: p.raw, s: amb.s, e: amb.e, options: amb.ids };
    return { html: `<p>«${NB}${esc(p.raw.slice(amb.s, amb.e))}${NB}» peut désigner plusieurs arrêts. Lequel${NNB}?</p>`, chips: amb.ids.map(id => ({ label: STOPS[id].name, send: STOPS[id].name })), map: { type: 'stops', stops: amb.ids } };
  }
  const dirM = p.mentions.find(m => m.dir);
  const stops = p.mentions.filter(m => !m.dir).map(m => ({ id: m.ids[0], role: m.role || null, toward: m.toward }));
  const q = resolveWhen(p.when, now, stops.length >= 2 ? { first: K.first && !K.last, last: K.last && !K.first } : null);
  const done = r => {
    if (r.pending) ctx.pending = r.pending; else if (r.last && r.last.kind === 'route') ctx.pending = null;
    if (r.last) ctx.last = r.last;
    return r;
  };

  // A. on attendait un départ ou une arrivée
  if (ctx.pending && stops.length === 1 && !K.fare && !p.topic && !p.lines.length && !K.sched) {
    const pd = ctx.pending, s = stops[0], role = s.role || pd.ask;
    pd[role] = s.id;
    if (p.when.has) pd.when = p.when;
    if (pd.from && pd.to) { ctx.pending = null; return done(tripReply(pd.from, pd.to, resolveWhen(pd.when || p.when, now), now)); }
    return askMissing(pd);
  }

  // B. deux arrêts : itinéraire
  if (stops.length >= 2) {
    let [a, b] = stops;
    if ((a.role === 'to' && b.role !== 'to') || (b.role === 'from' && a.role !== 'from')) [a, b] = [b, a];
    return done(tripReply(a.id, b.id, q, now));
  }

  // C. suites d'une réponse précédente
  if (!stops.length && !p.lines.length && !K.fare && !p.topic && ctx.last) {
    const L = ctx.last;
    if (L.kind === 'route') {
      if (K.back) return done(tripReply(L.to, L.from, p.when.has ? q : L.q, now));
      if (p.when.has) return done(tripReply(L.from, L.to, q, now));
      if (K.next) return done(tripReply(L.from, L.to, Object.assign({}, L.q, { mode: 'depart', t: L.journey.dep + 1, first: false, last: false, assumed: false, live: false }), now));
      if (K.prev) return done(tripReply(L.from, L.to, Object.assign({}, L.q, { mode: 'arrive', t: L.journey.arr - 1, first: false, last: false, assumed: false, live: false }), now));
    }
    if (L.kind === 'stop' && (p.when.has || K.next) && !K.go) return done(boardReply(L.stop, q, L.filter, now));
    if (L.kind === 'line' && (K.first || K.last || p.when.day)) return done(firstLastReply(L.line, null, q.date, now, { first: K.first || !K.last, last: K.last || !K.first }));
  }

  // D. informations pratiques, E. tarifs
  if (p.topic && !(stops.length && (K.go || K.sched))) return infoReply(p.topic);
  if (K.fare) return fareReply(p);

  // F. une ligne est citée
  if (p.lines.length) {
    const id = p.lines[0];
    const head = dirM && LINE[id].dirs.some(d => d.head === dirM.ids[0]) ? dirM.ids[0] : null;
    if (K.first || K.last) return done(firstLastReply(id, stops[0] ? stops[0].id : null, q.date, now, { first: K.first || !K.last, last: K.last || !K.first }));
    if (stops.length === 1) return done(boardReply(stops[0].id, q, { line: id, head }, now));
    return done(lineReply(id, now));
  }

  // G. un seul arrêt
  if (stops.length === 1) {
    const s = stops[0];
    if (K.go || (!K.sched && K.leave) || s.toward) {
      const pd = { when: p.when.has ? p.when : null };
      pd[s.role || (K.leave && !K.go ? 'from' : 'to')] = s.id;
      if (p.unknown) { ctx.pending = pd; pd.ask = pd.from ? 'to' : 'from'; return unknownReply(p.unknown); }
      return askMissing(pd);
    }
    const head = dirM && STOPS[s.id].lines.some(l => LINE[l].dirs.some(d => d.head === dirM.ids[0])) ? dirM.ids[0] : null;
    return done(boardReply(s.id, q, { head }, now));
  }

  // H à M. sans arrêt ni ligne
  if (p.unknown && (K.go || K.leave || ctx.pending)) return unknownReply(p.unknown);
  if (K.lines) return linesReply();
  if (K.first || K.last) return { html: `<p>Pour quelle ligne${NNB}?</p>`, chips: LINES.map(l => ({ label: l.code, send: (K.last && !K.first ? 'Dernier ' : K.first && !K.last ? 'Premier ' : 'Premier et dernier ') + lineWord(l.id) })) };
  if (K.sched) return { html: `<p>Pour quel arrêt ou quelle ligne voulez-vous les horaires${NNB}? Par exemple «${NB}prochains passages à Opéra${NB}» ou «${NB}ligne T2${NB}».</p>`, chips: [{ label: 'Voir les lignes', send: 'Quelles sont les lignes ?' }] };
  if (K.go || K.leave) return askMissing({ when: p.when.has ? p.when : null });
  if (K.help) return helpReply();
  if (K.bye) return { html: `<p>Bon voyage sur le réseau ${RESEAU.nom}${NNB}!</p>` };
  if (K.thanks) return { html: `<p>Avec plaisir. Autre chose${NNB}?</p>` };
  if (/\b(ca va|comment vas tu|comment allez vous)\b/.test(p.flat)) return { html: `<p>Tout roule, merci${NNB}! Où souhaitez-vous aller${NNB}?</p>` };
  if (K.greet) return welcome();
  if (K.ok) return { html: `<p>Très bien. Dites-moi si vous avez besoin d’un autre trajet ou d’un horaire.</p>` };
  if (ctx.pending) return { html: `<p>Je n’ai pas reconnu d’arrêt dans votre message. ${ctx.pending.ask === 'to' ? 'Où allez-vous' : 'D’où partez-vous'}${NNB}? Donnez un nom d’arrêt, par exemple Opéra ou Gare Centrale, ou choisissez-le sur le plan.</p>` };
  return {
    html: `<p>Je n’ai pas compris cette demande. Je sais répondre sur les itinéraires, les lignes, les horaires et les tarifs du réseau ${RESEAU.nom}.</p>`,
    chips: EXAMPLES,
  };
}

    $('#planToggle').textContent = open ? 'Conversation' : 'Plan';
  }
  form.addEventListener('submit', e => { e.preventDefault(); const v = input.value.trim(); if (!v) return; input.value = ''; ask(v); });
  document.addEventListener('click', e => {
    const send = e.target.closest('[data-send]');
    if (send) {
      const inPlan = plan.contains(send);
      ask(send.dataset.send);
      if (inPlan && send.closest('.pop')) setPlan(false);
      if (inPlan && send.closest('.legend') && !matchMedia('(max-width:900px)').matches) input.focus();
      return;
    }
    const see = e.target.closest('[data-plan]');
    if (see) { showOnMap(payloads.get(see.dataset.plan)); setPlan(true); }
  });
  $('#planToggle').addEventListener('click', () => setPlan(!plan.classList.contains('open')));
  $('#planReset').addEventListener('click', () => showOnMap(null));
  $('#reset').addEventListener('click', () => { resetContext(); thread.textContent = ''; payloads.clear(); showOnMap(null); addBot(welcome(), true); input.focus(); });
  const setBarH = () => document.documentElement.style.setProperty('--bar-h', document.querySelector('.bar').offsetHeight + 'px');
  setBarH(); addEventListener('resize', setBarH);

  addBot(welcome(), true);
  input.focus();
})();

if (typeof module === 'object' && module.exports) module.exports = { respond, resetContext, parse, network, departAt, arriveBy, nextDepartures, depTimes, dayType, STOPS, LINES, LINE, fmt, ctx: () => ctx };
</script>
